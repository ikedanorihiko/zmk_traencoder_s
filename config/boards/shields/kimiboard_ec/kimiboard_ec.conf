# ==== KimiBoard EC 基本設定 ====

# BLE (単体・無線動作)
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# バッテリー電圧レポート(XIAO BLEはバッテリー計測回路が別途必要な場合あり)
CONFIG_ZMK_BATTERY_REPORTING=y

# ポインティングデバイス(トラックボール)関連
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# PMW3610センサー設定
CONFIG_PMW3610=y
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300
# ビルドが通らない/センサーが認識されない場合、上の値を1000程度まで増やして試してください

# ロータリーエンコーダー
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# オートマウスレイヤー(ボールを動かすと自動でレイヤー1=マウスレイヤーに入る機能)
# 実装は Kconfig ではなく overlay 側の input-processor (zip_temp_layer) で行っています。
# 詳細: kimiboard_ec.overlay の kimiboard_listener を参照
